<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#2a120a"><meta name="format-detection" content="telephone=no">
<title>Master Wijen Ligtning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fg:#f3e3c3;--dim:#a8977a;--acc:#e8a33d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;right:0;bottom:0;left:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:16px 20px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:18px;margin:0 0 4px;font-weight:700;letter-spacing:.02em}
.hint{font-size:12px;color:var(--dim);line-height:1.5}
#stat{text-align:right;min-width:150px}
#count{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc)}
#bar{height:5px;border-radius:3px;background:#2a2218;margin-top:6px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#c9812a,#f5d38a);transition:width .15s}
#msg{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));text-align:center;font-size:20px;font-weight:700;color:var(--acc);opacity:0;transition:opacity .5s;pointer-events:none}
#toast{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;color:#fff;font-family:'Bungee',Impact,'Arial Black',sans-serif;font-size:clamp(30px,8vw,88px);line-height:1.05;padding:0 12px;text-shadow:0 0 14px rgba(255,255,255,.65),0 0 40px rgba(255,190,90,.7),0 4px 0 rgba(0,0,0,.5);opacity:0}
#toast .ch{display:inline-block;opacity:0;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
#toast .sp{display:inline-block;width:.35em}
#toast.show{animation:hold 2.4s ease forwards}
#toast small{display:block;font-size:.22em;letter-spacing:.35em;margin-top:.6em;opacity:.8;animation:fadeIn .6s .5s both}
@keyframes pop{0%{opacity:0;transform:translateY(60px) scale(.2) rotate(-25deg)}60%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes hold{0%{opacity:1;transform:scale(.9)}8%{transform:scale(1.08)}16%{transform:scale(1)}78%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.06)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:.8;transform:none}}
#reset{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1b150e;color:var(--fg);border:1px solid #4a3a22;border-radius:20px;padding:8px 20px;font-size:13px;cursor:pointer}
#auto{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(52px);background:#1b150e;color:var(--fg);border:1px solid #4a3a22;border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer}
#skinbox{position:fixed;right:20px;top:calc(env(safe-area-inset-top,0px) + 86px);z-index:5;display:flex;flex-direction:column;align-items:flex-end}
#skinbtn{background:#1b150e;color:var(--fg);border:1px solid #4a3a22;border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer}
#skinbtn:hover{background:#2a2014}
#skinlist{margin-top:6px;background:#140f09;border:1px solid #4a3a22;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px}
#skinlist[hidden]{display:none}
#skinlist button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;text-align:left;white-space:nowrap}
#skinlist button:hover{background:#2a2014}
#skinlist button.on{color:var(--acc)}
#skinlist i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:inline-block}
#auto.on{border-color:var(--acc);color:var(--acc)}
#reset:hover{background:#2a2014}

#menu{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;overflow:hidden;background:linear-gradient(#0d6fd1 0%,#2aa3e6 45%,#8fe0f0 80%,#c9f3e4 100%);font-family:'Bungee',Impact,'Arial Black',sans-serif;transition:opacity .6s,visibility .6s;-webkit-user-select:none;user-select:none}
#menu.gone{opacity:0;visibility:hidden;pointer-events:none}
#menu svg.scene{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.cl{animation:drift 60s linear infinite}.cl.b{animation-duration:90s;animation-delay:-30s}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
.isle{animation:bob 6s ease-in-out infinite}.ond{animation:bob 4s ease-in-out infinite reverse}
@keyframes bob{50%{transform:translateY(-14px)}}
.fall{stroke-dasharray:14 10;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.bird{animation:fly 14s linear infinite}
@keyframes fly{from{transform:translate(-80px,0)}to{transform:translate(1100px,-60px)}}
#flash{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;opacity:0;pointer-events:none;animation:flash 8s infinite}
@keyframes flash{0%,90%,94%,100%{opacity:0}91%{opacity:.75}92.5%{opacity:.1}93%{opacity:.55}}
#bolt{animation:bolt 8s infinite;opacity:0}
@keyframes bolt{0%,90%,94%,100%{opacity:0}91%,93%{opacity:1}92%{opacity:.2}}
#mbox{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:clamp(24px,7vh,70px) 16px 0;text-align:center;pointer-events:none}
#mbox>*{pointer-events:auto}
.kick{color:#fff;font-size:clamp(11px,1.6vw,16px);letter-spacing:.4em;text-shadow:0 2px 6px rgba(0,60,120,.6)}
#mtitle{margin:.1em 0 0;color:#fff;font-weight:400;font-size:clamp(34px,8.5vw,104px);line-height:.95;transform:rotate(-3deg);text-shadow:0 0 18px rgba(255,255,255,.7),0 0 46px rgba(255,214,90,.8),0 6px 0 #0a4f9c,0 10px 18px rgba(0,40,100,.5)}
#mtitle em{font-style:normal;color:#ffe066;display:block;text-shadow:0 0 18px #fff6b0,0 0 50px #ffb300,0 6px 0 #b86a00,0 10px 18px rgba(80,30,0,.5)}
#mbtns{margin-top:auto;margin-bottom:clamp(40px,12vh,120px);display:flex;flex-direction:column;gap:14px;width:min(300px,80vw)}
.mb{font-family:inherit;font-size:22px;letter-spacing:.08em;padding:14px 20px;border-radius:16px;cursor:pointer;border:0;transition:transform .15s,box-shadow .15s}
.mb:hover,.mb:focus-visible{transform:translateY(-3px) scale(1.04);outline:0}
#mplay{background:linear-gradient(#ffe680,#f2a417);color:#5a2c00;box-shadow:0 5px 0 #a65f00,0 0 28px rgba(255,200,60,.8)}
#mexit{background:rgba(255,255,255,.22);color:#fff;border:2px solid rgba(255,255,255,.8);backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(0,60,120,.35)}
#bye{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(4,40,40,.82);color:#fff;text-align:center;z-index:2;padding:20px}
#bye.on{display:flex}#bye h2{font-weight:400;font-size:clamp(26px,6vw,56px);margin:0;text-shadow:0 0 24px rgba(255,214,90,.8)}
#bye p{font-family:system-ui,sans-serif;margin:0;opacity:.8}
#bye .mb{width:min(300px,80vw)}
#menubtn{position:fixed;left:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#1b150e;color:var(--fg);border:1px solid #4a3a22;border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer;z-index:6}
#menubtn:hover{background:#2a2014}
@media(prefers-reduced-motion:reduce){#menu *{animation:none!important}}
#fpsb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font:11px/1 ui-monospace,Menlo,monospace;color:#cfe;background:rgba(0,0,0,.45);padding:5px 8px;border-radius:8px;pointer-events:none;z-index:6}
#hud{text-shadow:0 1px 5px rgba(0,0,0,.9)}
#vig{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 30%,rgba(12,4,0,.45) 75%,rgba(12,4,0,.7) 100%)}
html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#mexit{-webkit-backdrop-filter:blur(6px)}
@media(max-width:640px){
#hud{padding:10px 12px}h1{font-size:15px}.hint{font-size:11px}#stat{min-width:110px}#count{font-size:22px}
#skinbox{right:12px;top:calc(env(safe-area-inset-top,0px) + 76px)}
#menubtn,#reset,#auto{padding:10px 16px;font-size:13px}
#menubtn{left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#reset{left:auto;right:12px;transform:none;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#auto{left:12px;transform:none;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
#fpsb{right:auto;left:50%;transform:translateX(-50%)}
#msg{bottom:calc(112px + env(safe-area-inset-bottom,0px))}}
</style>
</head>

<script>
window.addEventListener('error',function(e){try{var d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:rgba(120,0,0,.92);color:#fff;font:12px/1.4 -apple-system,sans-serif;padding:10px 12px;border-radius:10px;pointer-events:none';document.body.appendChild(d);}d.textContent='Gagal memuat game: '+(e.message||'error')+(window.THREE?'':' (Three.js tidak termuat, cek koneksi internet)');}catch(_){}});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script>
(function(){
const GOAL=1000, CAP=3500, MIN_DOT=1-(0.07*0.07)/2;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
const MOB=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
const ANISO=renderer.capabilities.getMaxAnisotropy(),MAXT=renderer.capabilities.maxTextureSize;
const PRmax=Math.min(Math.max(window.devicePixelRatio||1,1.5),MOB?2.5:3);let PR=MOB?1.5:PRmax;renderer.setPixelRatio(PR);
canvas.addEventListener('webglcontextlost',e=>e.preventDefault());canvas.addEventListener('webglcontextrestored',()=>location.reload());
function setPR(v){PR=v;renderer.setPixelRatio(v);resize();}
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.88;
renderer.setClearColor(0x2a120a,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,50);
camera.position.set(0,0,4.6);
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?52:40;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,250));if(window.visualViewport)visualViewport.addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xffd9b0,0x1a0a02,0.38));
const key=new THREE.DirectionalLight(0xffcf92,1.05);key.position.set(3,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x8fb4ff,0.45);rim.position.set(-4,2,-3);scene.add(rim);
const fill=new THREE.PointLight(0xff9a40,0.45,12);fill.position.set(-3,-2,3);scene.add(fill);


// ===== LATAR DAPUR (low-poly, statis, murah untuk GPU) =====
const room=new THREE.Group();scene.add(room);
const LM=c=>new THREE.MeshLambertMaterial({color:c});
const M={wall:LM(0x7a3220),wain:LM(0xeedcbc),blue:LM(0x93b4d0),blueD:LM(0x7599b9),wood:LM(0xe0b377),woodD:LM(0xa8703a),floor:LM(0xa8632f),white:LM(0xf6f2ea),dark:LM(0x2b2623),steel:LM(0xbfc2c6),cream:LM(0xe8cc9e),yellow:LM(0xeaa92b),green:LM(0x4a8a3e),red:LM(0xc4452f),glass:LM(0x3a302c),curt:LM(0xeed49c),win:new THREE.MeshBasicMaterial({color:0xfff3c8})};
function add(g,m,x,y,z,rx=0,ry=0,rz=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.updateMatrix();o.matrixAutoUpdate=false;room.add(o);return o;}
const B=(m,x,y,z,w,h,d)=>add(new THREE.BoxGeometry(w,h,d),m,x,y,z);
const C=(m,x,y,z,r,h,seg=10,rx=0)=>add(new THREE.CylinderGeometry(r,r,h,seg),m,x,y,z,rx);
function oval(m,a,b,y){const o=add(new THREE.CylinderGeometry(1,1,.02,48),m,0,y,.5);o.scale.set(a,1,b);o.updateMatrix();}

for(const k in M){if(k==='win')continue;const m=M[k];m.color.multiplyScalar(k==='dark'||k==='glass'?1:(k==='white'||k==='steel'||k==='wain'||k==='cream'||k==='curt')?.72:.55);}
function mkTex(wood,rx,ry){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#dcdcdc';g.fillRect(0,0,256,256);
 for(let i=0;i<26;i++){g.fillStyle='rgba(0,0,0,.035)';g.beginPath();g.arc(Math.random()*256,Math.random()*256,25+Math.random()*50,0,7);g.fill();}
 if(wood)for(let i=0;i<70;i++){g.fillStyle='rgba(0,0,0,'+(.04+Math.random()*.08)+')';g.fillRect(0,Math.random()*256,256,1+Math.random()*3);}
 for(let i=0;i<1800;i++){const v=Math.random()>.5?255:0;g.fillStyle='rgba('+v+','+v+','+v+',.05)';g.fillRect(Math.random()*256,Math.random()*256,2,2);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;return t;}
M.floor.map=mkTex(true,14,8);M.wall.map=mkTex(false,10,3);M.wain.map=mkTex(false,10,1);
for(const k of ['wood','woodD'])M[k].map=mkTex(true,1,1);
for(const k of ['blue','blueD','cream','red','yellow','green','white','curt'])M[k].map=mkTex(false,1,1);
scene.background=new THREE.Color(0x1a0a05);
// lantai, karpet oval, dinding
B(M.floor,0,-3.25,-2,40,.1,24);
oval(M.cream,5.4,3.5,-3.188);oval(M.red,4.6,2.9,-3.184);oval(M.cream,4.0,2.4,-3.18);
B(M.wall,0,1.5,-6.1,40,10,.2);B(M.wain,0,-.325,-5.95,40,1.55,.1);
// kabinet belakang + pintu
B(M.blue,1.0,-2.15,-5.2,8.8,2.1,1.6);B(M.wood,1.0,-1.05,-5.1,8.9,.1,1.8);
for(let x=-2.6;x<5;x+=1.5){B(M.blueD,x,-2.15,-4.39,1.3,1.8,.04);B(M.wood,x+.5,-1.6,-4.35,.35,.06,.05);}
// kompor
B(M.cream,-5.2,-2.15,-5.1,3.4,2.1,1.9);B(M.steel,-5.2,-1.07,-5.1,3.4,.1,1.9);
for(const [x,z] of [[-5.9,-5.5],[-4.5,-5.5],[-5.9,-4.7],[-4.5,-4.7]])C(M.dark,x,-.99,z,.3,.06,14);
B(M.glass,-5.2,-2.1,-4.13,2.7,1.2,.04);B(M.steel,-5.2,-1.45,-4.07,2.6,.07,.07);
for(let i=0;i<4;i++)C(M.dark,-6.2+i*.8,-1.25,-4.13,.09,.06,8,Math.PI/2);

function afeel(side){const g=new THREE.BoxGeometry(.004,.004,.05);g.rotateX(-.5);g.rotateY(side*.3);g.translate(side*.012,.05,.085);return g;}
const antBody=mg([sph(.04,.9,.85,1.25,0,.03,-.07),sph(.026,.9,.9,1.2,0,.032,-.005),sph(.028,.9,.9,1,0,.032,.05),afeel(1),afeel(-1)]);
const antLegA=mg([aleg(-1,.02,.5),aleg(1,0,0),aleg(-1,-.02,-.5)]);
const antLegB=mg([aleg(1,.02,.5),aleg(-1,0,0),aleg(1,-.02,-.5)]);
const ants=[],_ax=new THREE.Vector3(),_aq=new THREE.Quaternion(),_am=new THREE.Matrix4();
for(let i=0;i<16;i++){
  const g=new THREE.Group();g.scale.setScalar(1.25);
  const la=new THREE.Mesh(antLegA,antMat),lb=new THREE.Mesh(antLegB,antMat);
  g.add(new THREE.Mesh(antBody,antMat),la,lb);antGroup.add(g);
  const n=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize();
  const h=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1));h.addScaledVector(n,-h.dot(n)).normalize();
  ants.push({g,la,lb,n,h,turn:0,sp:.2+Math.random()*.2,f:16+Math.random()*6,ph:Math.random()*6});
}
function updateAnts(dt,T){
  if(!antGroup.visible)return;
  for(const a of ants){
    a.turn+=(Math.random()-.5)*9*dt;a.turn*=1-1.5*dt;
    _aq.setFromAxisAngle(a.n,a.turn*dt);a.h.applyQuaternion(_aq);
    a.n.addScaledVector(a.h,a.sp*dt).normalize();
    a.h.addScaledVector(a.n,-a.h.dot(a.n)).normalize();
    _ax.crossVectors(a.n,a.h);
    _am.makeBasis(_ax,a.n,a.h);a.g.quaternion.setFromRotationMatrix(_am);
    a.g.position.copy(a.n);
    const sw=Math.sin(T*a.f+a.ph)*.3;a.la.rotation.y=sw;a.lb.rotation.y=-sw;
  }
}
const skinTex={};
function applySkin(n){
  skin=n;antGroup.visible=(n==='semut');const m=ball.material;let t;
  if(n==='original'||n==='steril'){if(n==='steril')ensurePlastic();if(!origMap){if(plastic)plastic.visible=n==='steril';return;}t=origMap;m.roughness=.62;}
  else{const S=SKINS[n];t=skinTex[n]||(skinTex[n]=S.paint?S.paint():paintSkin(S));m.roughness=S.r;}
  m.map=t;m.bumpMap=null;m.bumpScale=0;m.needsUpdate=true;if(plastic)plastic.visible=n==='steril';
  document.querySelectorAll('#skinlist button').forEach(b=>b.classList.toggle('on',b.dataset.k===n));
}
const skinList=document.getElementById('skinlist'),skinBtn=document.getElementById('skinbtn');
const ITEMS=[['original','Onde-Onde Original','#e6a94a']].concat(Object.keys(SKINS).map(k=>[k,SKINS[k].name,SKINS[k].sw]));
for(const [k,nm,sw] of ITEMS){
  const b=document.createElement('button');b.dataset.k=k;
  b.innerHTML='<i style="background:'+sw+'"></i>'+nm;
  if(k==='original')b.classList.add('on');
  b.addEventListener('click',()=>{applySkin(k);skinList.hidden=true;sv-=0.6;burst(new THREE.Vector3(0,0,1.2),30,1.8);sfx(600,'triangle',.05,.12);});
  skinList.appendChild(b);
}
skinBtn.addEventListener('click',()=>{skinList.hidden=!skinList.hidden;});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#skinbox'))skinList.hidden=true;});
const autoBtn=document.getElementById('auto');
autoBtn.addEventListener('click',()=>{auto=!auto;idleT=0;autoBtn.classList.toggle('on',auto);autoBtn.textContent='Putar otomatis: '+(auto?'ON':'OFF');});
const clock=new THREE.Clock();
const tmpW=new THREE.Vector3();

let _pl=performance.now(),_pa=0,_pn=0,_adj=0,_fn2=0,_ft=_pl;const fpsEl=document.getElementById('fpsb');
function perf(){const now=performance.now(),d=now-_pl;_pl=now;_pa+=d;_pn++;_fn2++;
 if(_pn>=45){const avg=_pa/_pn;_pa=0;_pn=0;if(now-_adj>1500){if(avg>18.5&&PR>1){setPR(Math.max(1,PR-.25));_adj=now;}else if(avg<17.5&&PR<PRmax){setPR(Math.min(PRmax,PR+.25));_adj=now;}}}
 if(now-_ft>500){fpsEl.textContent=Math.round(_fn2*1000/(now-_ft))+' FPS \u00b7 '+canvas.width+'\u00d7'+canvas.height;_fn2=0;_ft=now;}}
let _lf=0;
function frame(now){
  requestAnimationFrame(frame);
  const el=now-_lf;if(el<15.5)return;_lf=now-(el%16.667);perf();
  const dt=Math.min(clock.getDelta(),0.05),T=clock.elapsedTime;

  // sprinkle saat ditahan
  if(down&&!dragging&&btn===0&&performance.now()-downT>220){
    const now=performance.now();
    if(now-lastSprinkle>55){lastSprinkle=now;sprinkled=true;place();}
  }
  // inersia & idle
  if(!down){
    if(false){}
    else{}
  }
  // pegas & melayang
  sv+=(-420*sx-15*sv)*dt;sx+=sv*dt;
  pivot.scale.setScalar(1+sx);
  pivot.position.y=0;
  if(auto&&!(down&&btn===2)&&!(touch&&down&&dragging)){_q.setFromAxisAngle(Y,0.3*dt);rotor.quaternion.premultiply(_q).normalize();}

  updateAnts(dt,T);
  // animasi jatuh wijen
  for(let k=active.length-1;k>=0;k--){
    const a=active[k];a.t+=dt/0.32;
    const t=Math.min(a.t,1);
    const h=Math.pow(1-t,2)*0.7;
    const sc=t<1?(0.25+0.75*t)*(1+0.5*Math.sin(t*3.14)):1;
    seeds.setMatrixAt(a.i,seedMatrix(a.n,a.spin+(1-t)*2.5,h,sc));
    if(a.t>=1){
      seeds.setMatrixAt(a.i,seedMatrix(a.n,a.spin,0,1));
      tmpW.copy(a.n).multiplyScalar(1.02);rotor.localToWorld(tmpW);
      burst(tmpW,4,0.7);
      sv-=0.35;
      sfx(700+Math.random()*500,'triangle',.05,.07);
      active.splice(k,1);
      if(placed>=GOAL&&!celebrated&&active.length===0){
        celebrated=true;
        for(let b=0;b<12;b++){tmpW.set(rnd(-1,1),rnd(-1,1),rnd(.2,1.2));burst(tmpW,30,2.5);}
        sfx(520,'sine',.08,.5);setTimeout(()=>sfx(780,'sine',.08,.5),140);setTimeout(()=>sfx(1040,'sine',.08,.7),280);
      }
    }
  }
  if(active.length||placed)seeds.instanceMatrix.needsUpdate=true;

  for(let k=falls.length-1;k>=0;k--){
    const f=falls[k];f.v.y-=9*dt;f.p.addScaledVector(f.v,dt);
    const d=f.p.length();
    if(d<1.07){
      const nw=_fn.copy(f.p).divideScalar(d),vn=f.v.dot(nw);
      if(vn<0){f.v.addScaledVector(nw,-1.45*vn).multiplyScalar(.97);if(vn<-.6)sfx(260+Math.random()*120,'sine',.04,.06);}
      f.p.copy(nw).multiplyScalar(1.07);
    }
    _fq.setFromAxisAngle(f.ax,f.w*dt);f.q.premultiply(_fq);
    fallMesh.setMatrixAt(f.i,_fm.compose(f.p,f.q,SS));
    if(f.p.y<-5){fallMesh.setMatrixAt(f.i,zeroM);falls.splice(k,1);}
  }
  fallMesh.instanceMatrix.needsUpdate=true;
  // partikel
  for(let i=0;i<PN;i++){
    if(pLife[i]>0){
      pLife[i]-=dt*1.6;
      pVel[i*3+1]-=3*dt;
      pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
      const l=Math.max(0,pLife[i]);
      pCol[i*3]=1*l;pCol[i*3+1]=.85*l;pCol[i*3+2]=.55*l;
    }else{pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0;}
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;

  // pratinjau
  ghost.visible=false;
  if(hasPointer&&!dragging){
    const n=pick();
    if(n){
      ghost.visible=true;
      ghost.matrixAutoUpdate=false;
      seedMatrix(n,T*2,0.012+Math.sin(T*6)*0.006,1.05);ghost.matrix.copy(_m);
      ghostMat.color.set(blocked(n)||!canStick(n)?0xff5a40:0xfff0c0);
    }
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
<script>
(function(){
const menu=document.getElementById('menu'),bye=document.getElementById('bye'),mb=document.getElementById('menubtn');
function play(){menu.classList.add('gone');mb.hidden=false;}
function toMenu(){bye.classList.remove('on');menu.classList.remove('gone');mb.hidden=true;document.getElementById('mplay').focus();}
if(matchMedia('(pointer:coarse)').matches){document.querySelector('.hint').innerHTML='Ketuk: taruh wijen · Tahan: hujan wijen<br>Geser: putar onde-onde · Cubit: zoom';}
document.getElementById('mplay').onclick=play;
document.getElementById('mexit').onclick=function(){bye.classList.add('on');try{window.close();}catch(e){}};
document.getElementById('mback').onclick=toMenu;
mb.onclick=toMenu;
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!menu.classList.contains('gone')&&!bye.classList.contains('on'))play();});
})();
</script>
